[package]
name = "bro-stream-workers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
polymarket_client_sdk_v2 = { git = "https://github.com/Polymarket/rs-clob-client-v2.git", rev = "8ba5008733c3c03e92041eef8b1cb8495dbed718", features = ["clob", "ws", "rtds"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "time"] }
