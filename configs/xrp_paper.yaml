bot_name: "Bro-XRP-Paper"
mode: "paper"

asset:
  symbol: "XRP"
  chainlink_symbols: ["xrp/usd"]
  discovery_symbols: ["XRP"]

targets:
  token_ids: []
  discovery:
    enabled: true
    max_pairs: 7

sizing:
  mode: "notional"
  min_usd: 1
  max_usd: 20
  target_usd: 5
  rounding: "floor"
  price_source: "mid"
  share_step: 0.01
  exposure_cap_mode: "per_market_total"

storage:
  log_dir: "../logs_exec_xrp_paper"
  state_path: "../logs_exec_xrp_paper/state.json"

runtime:
  guard_stop_file: "../logs_exec_xrp_paper/guard_stop.txt"

ramp:
  reconcile_status_path: "../logs_exec_xrp_paper/reconcile_latest.json"

security:
  allowed_storage_roots:
    - "../logs_exec_xrp_paper"
