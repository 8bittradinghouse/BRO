extends: ./base.yaml

profile:
  name: paper_universal

mode: paper

runtime:
  # Keep runtime cap above longest planned active window so canonical session
  # active-minute requests (8/20/45/60/120) are not clipped by runtime cap.
  duration_min: 130
  guard_stop_file: /logs/paper_universal/guard_stop.txt
  # Keep paper conservative: no synthetic passive fills that are easier than live.
  paper_passive_touch_fill_enabled: false
  paper_passive_touch_fill_ratio: 0.0
  paper_passive_near_touch_band: 0.0
  paper_passive_near_touch_fill_ratio: 0.0
  paper_background_fill_ratio: 0.0
  # Paper realism: thin overnight books and bounded queue-ahead proxy are explicit.
  paper_liquidity_tod_scaler_enabled: true
  paper_liquidity_tod_start_hour_utc: 2
  paper_liquidity_tod_end_hour_utc: 6
  paper_liquidity_tod_depth_multiplier: 0.6
  paper_queue_position_mode: bounded_top_depth_proxy
  paper_queue_position_ahead_ratio: 0.35
  paper_chainlink_lag_emulation_enabled: true
  paper_chainlink_lag_window_low_sec: 2.0
  paper_chainlink_lag_window_high_sec: 15.0
  paper_chainlink_lag_penalty_bps_below_window: 0.0
  paper_chainlink_lag_penalty_bps_within_window: 2.0
  paper_chainlink_lag_penalty_bps_above_window: 4.0
  # Keep maker orders resting long enough to avoid synthetic churn and align with
  # realistic maker-lifecycle semantics.
  maker_replace_min_rest_sec: 3.0
  paper_enforce_setup_lock: true
  paper_expected_profile_name: paper_universal
  paper_expected_config_fingerprint_sha256: "e7bb45a688791b152e87d86f88664b2df0b05800da406b531baf2a372f15e7b2"
  held_book_not_found_backoff_sec: 5.0
  held_book_not_found_force_refresh_min_unpriceable_age_sec: 20.0
  held_book_not_found_force_refresh_interval_sec: 45.0
  held_preexpiry_reduce_only_sec: 90.0

# Small, reversible maker-lag relaxation for diagnostic verification.
# Scope: paper_universal profile only.
latency_verifier:
  min_samples: 15
  hit_threshold_ms: 40
  armed_min_median_ms: 40
  armed_min_hit_rate: 0.30
  probation_min_median_ms: 30
  probation_min_hit_rate: 0.15
  score_min_for_maker: 0.08

# Targeted maker-gate hardening (surgical):
# - widen queue depth tolerance modestly
# - slightly relax expected-fill floor
# preserving explicit skip semantics and fail-closed behavior.
strategy:
  max_order_size: 8000.0
  execution_quality:
    max_queue_ahead_size: 300.0
    min_expected_fill_prob: 0.045
    reduce_only_recovery_min_expected_fill_prob_floor: 0.02
    reduce_only_recovery_max_queue_ahead_size_multiplier: 2.0
  maker_competitiveness:
    timing_gate_enabled: true
    timing_gate_min_sec_to_expiry: 45.0
    timing_gate_max_sec_to_expiry: 60.0
    edge_scale_enabled: true
    edge_scale_start_abs: 0.05
    edge_scale_full_abs: 0.20
    size_mult_max: 1.35
    spread_mult_min: 0.75
    requote_delta_mult_min: 0.50
    one_sided_enabled: true
    one_sided_edge_threshold_abs: 0.18
    one_sided_allowed_stages:
      - MAKER_TAKER_SELECTIVE

# Maker competitiveness sizing: enforce desk-viable minimum quote presence and
# bind to visible depth while preserving deterministic, bounded behavior.
sizing:
  max_usd: 300.0
  maker_competitive_min_notional_usd: 100.0
  maker_competitive_max_notional_usd: 250.0
  maker_competitive_min_shares: 200.0
  maker_competitive_max_shares: 800.0
  maker_depth_target_min_ratio: 0.15
  maker_depth_target_max_ratio: 0.30
  maker_depth_target_ratio: 0.20
  maker_liquidity_tod_scaler_enabled: true
  maker_liquidity_tod_start_hour_utc: 2
  maker_liquidity_tod_end_hour_utc: 6
  maker_liquidity_tod_depth_multiplier: 0.6

wallet:
  chain: polygon
  gas_asset_symbol: POL
  stable_asset_symbol: USDC.e
  active_wallet_address_source: auth.funder
  approval_spender_targets: []
  gas_reserve_target_pol: 0.2
  treasury_mode: logical
  treasury_wallet_address: ""

risk:
  # Keep new exposure out of terminal windows while preserving a non-empty
  # actionable interval in canonical maker/taker stages.
  min_sec_to_expiry_for_new_exposure: 45.0
  # Reserve submit-rate headroom for forced pre-expiry reduce-only recovery so
  # normal flow cannot fully consume the order-rate pool.
  order_rate_recovery_reserved_slots: 12
  max_abs_position_shares: 4000.0
  max_notional_per_token: 1300.0
  max_order_size: 8000.0
  dynamic_scaling:
    enabled: true
    volatility_enabled: true
    volatility_low_threshold: 0.0015
    volatility_high_threshold: 0.008
    volatility_low_mult: 1.05
    volatility_high_mult: 0.9
    tod_enabled: true
    tod_start_hour_utc: 2
    tod_end_hour_utc: 6
    tod_thin_liquidity_mult: 0.9
    edge_enabled: true
    edge_start_abs: 0.10
    edge_full_abs: 0.30
    edge_mult_max: 1.15
    min_effective_mult: 0.85
    max_effective_mult: 1.25
    unknown_input_policy: no_aggressive_uplift
  global_exposure_guard:
    enabled: true
    max_global_notional_usd: 2500.0
    sniper_reserved_notional_usd: 300.0
    near_cap_ratio: 0.85

# Grok-informed bounded lag accommodation:
# keep fail-closed behavior but avoid overreacting to short-lived oracle jitter.
doctrine:
  oracle_max_tick_age_sec: 5.0

secondary_oracle:
  pyth:
    enabled: true
    rest_url: "https://hermes.pyth.network/v2/updates/price/latest?ids[]={feed_id}&parsed=true"
    feed_id: "e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43"
    symbol: "BTC/USD"
    user_agent: "BRO/1.0"
    request_timeout_sec: 1.5
    poll_interval_sec: 0.5
    max_tick_age_sec: 15.0

# P1 taker tightening:
# keep high-conviction stages unchanged and only raise the selective-stage floor.
sniper:
  require_lag_verification: false
  taker:
    per_token_cooldown_sec_by_stage:
      SNIPER_PRIMARY: 0.75
    min_edge_by_stage:
      MAKER_TAKER_SELECTIVE: 0.20
      SNIPER_PRIMARY: 0.30
      EXTREME_ONLY: 0.25
    competitiveness:
      enabled: true
      hard_min_target_usd: 100.0
      hard_min_enforcement: skip_if_unachievable
      dynamic_size_enabled: true
      dynamic_size_edge_start_abs: 0.16
      dynamic_size_edge_full_abs: 0.35
      dynamic_size_target_usd_cap: 220.0
      conviction_model: edge_plus_latency_score
      edge_weight: 0.65
      latency_score_weight: 0.35
      dynamic_preview_enabled: true
      final_window_enabled: true
      final_window_sec: 60.0
      stage_final_window_sec_by_stage:
        MAKER_TAKER_SELECTIVE: 60.0
        SNIPER_PRIMARY: 30.0
      aggressive_window_enabled: false
      aggressive_window_sec: 10.0
      stage_aggressiveness:
        MAKER_TAKER_SELECTIVE:
          size_mult: 1.0
          price_aggress_bps: 0.0
        SNIPER_PRIMARY:
          size_mult: 1.0
          price_aggress_bps: 0.0
        EXTREME_ONLY:
          size_mult: 1.15
          price_aggress_bps: 5.0
      price_aggress_bps_max: 8.0
      multi_oracle_boost_enabled: true
      multi_oracle_boost_window_sec: 30.0
      multi_oracle_edge_threshold_abs: 0.20
      multi_oracle_target_usd_cap: 350.0
      multi_oracle_capital_pct_cap: 0.18
      stage_priority_enabled: true

storage:
  log_dir: /logs/paper_universal
  state_path: /data/paper_universal/state.json

alerts:
  guardian_hook_file: /logs/paper_universal/guardian_hook.jsonl

security:
  allowed_storage_roots:
    - /logs
    - /data

ramp:
  reconcile_status_path: /logs/paper_universal/reconcile_latest.json

targets:
  discovery:
    max_pairs: 2
    event_slug_probe_enabled: true
