extends: ./base.yaml

profile:
  name: live_pilot

mode: live

runtime:
  guard_stop_file: ../../logs_exec/live_pilot/guard_stop.txt

storage:
  log_dir: ../../logs_exec/live_pilot
  state_path: ../../data/live_pilot/state.json

alerts:
  guardian_hook_file: ../../logs_exec/live_pilot/guardian_hook.jsonl

security:
  allowed_storage_roots:
    - ../../logs_exec
    - ../../data

sizing:
  target_usd: 5
  max_usd: 20

risk:
  max_total_open_orders: 20
  max_open_orders_per_token: 3

auth:
  private_key_source:
    mode: file
    path: /run/secrets/polymarket_private_key
  funder_source:
    mode: file
    path: /run/secrets/polymarket_funder

ramp:
  reconcile_status_path: ../../logs_exec/live_pilot/reconcile_latest.json
