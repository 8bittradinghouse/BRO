bot_name: "Bro-BTC-Paper-Docker"
mode: "paper"
profile:
  name: "paper_universal"
  class: "canonical"

asset:
  symbol: "BTC"
  chainlink_symbols: ["btc/usd"]
  discovery_symbols: ["BTC"]

targets:
  token_ids: []
  discovery:
    enabled: true
    max_pairs: 2

sizing:
  mode: "notional"
  min_usd: 1
  max_usd: 20
  target_usd: 5
  rounding: "floor"
  price_source: "mid"
  share_step: 0.01
  exposure_cap_mode: "per_market_total"

storage:
  log_dir: "/logs/btc_paper"
  state_path: "/data/btc_paper/state.json"

runtime:
  guard_stop_file: "/logs/btc_paper/guard_stop.txt"
  paper_passive_touch_fill_enabled: false
  paper_passive_touch_fill_ratio: 0.0
  paper_passive_min_rest_sec: 1.0
  paper_passive_min_fill_size: 0.01
  paper_passive_near_touch_band: 0.0
  paper_passive_near_touch_fill_ratio: 0.0
  paper_background_fill_ratio: 0.0
  paper_enforce_setup_lock: true
  paper_expected_profile_name: "paper_universal"
  paper_expected_config_fingerprint_sha256: "fe2f0dc079eaba52e5179707df1f544704e3604e0a746ebe99399b27ac665867"

doctrine:
  mode: canonical
  oracle_max_tick_age_sec: 1.5

sniper:
  enabled: true
  arming_horizon_sec: 86400
  execution_cutoff_sec: 10
  late_fire_priority_band_sec: 5
  allow_without_expiry_metadata: false
  require_lag_verification: true
  taker:
    enabled: true
    min_edge: 0.015
    order_size: 20
    target_usd: 5
    max_orders_per_cycle: 2
    per_token_cooldown_sec: 0.25

security:
  allowed_storage_roots:
    - "/logs"
    - "/data"

ramp:
  reconcile_status_path: "/logs/btc_paper/reconcile_latest.json"
